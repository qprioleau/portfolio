{% extends "base.html" %}

{% block title %} Contact Me {% endblock %}

{% block content %}
<!--Your data goes here-->
<div class="hero-section">

    <div class="glass-card profile-card contact-card">

        <h1 class="contact-title">
            Contact Me
        </h1>

        <form
            id="contactForm"
            name="sentMessage"
            action="{{ url_for('contact') }}"
            method="post"
        >

            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    class="form-control"
                    id="name"
                    name="name"
                    type="text"
                    placeholder="Enter your name..."
                    required
                />

            </div>

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    class="form-control"
                    id="email"
                    name="email"
                    type="email"
                    placeholder="Enter your email..."
                    required
                />

            </div>

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    class="form-control"
                    id="phone"
                    name="phone"
                    type="tel"
                    placeholder="Enter your phone number..."
                    required
                />

            </div>

            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                    class="form-control"
                    id="message"
                    name="message"
                    placeholder="Enter your message here..."
                    required
                ></textarea>

            </div>

            <div class="button-group">

                <button
                    class="button medium btn btn-primary text-uppercase"
                    id="submitButton"
                    type="submit"
                >
                    Send
                </button>


            </div>

        </form>

    </div>

</div>
{% endblock %}
